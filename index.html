}
:root[data-theme="dark"]{
  --bg:#0B111A;--surface:#151E2B;--soft:#0F1622;--ink:#EAF0F7;--on-ink:#0B111A;
  --muted:#98A5B8;--line:#26334A;--shadow:0 1px 2px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.28);

<script>
(function(){
'use strict';
/*LOGIC-START*/
var KEY='reventa-temu-v1';
var clone=function(o){return JSON.parse(JSON.stringify(o));};
var DEFAULT={v:1,settings:{reinvest:50,reserve:20,markup:50,cur:'COP'},products:[],purchases:[],sales:[],moves:[],lastBackup:0};
var storageOK=true;
var r2=function(n){return Math.round(n*100)/100;};
var num=function(v){
  var s=String(v==null?'':v).trim().replace(/\s/g,'');
  if(!s)return 0;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(/\.\d{3}(\.|$)/.test(s))s=s.replace(/\./g,'');
  var n=parseFloat(s);
  return isFinite(n)?n:0;
};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);};

function migrate(d){
  var b=clone(DEFAULT);
  if(!d||typeof d!=='object')return b;
  ['products','purchases','sales','moves'].forEach(function(k){if(Array.isArray(d[k]))b[k]=d[k];});
  if(d.settings&&typeof d.settings==='object')Object.assign(b.settings,d.settings);
  var s=b.settings;
  s.reinvest=Math.min(100,Math.max(0,Math.round(num(s.reinvest))));
  s.reserve=Math.min(100-s.reinvest,Math.max(0,Math.round(num(s.reserve))));
  s.markup=Math.max(0,num(s.markup));
  s.cur='COP';
  delete s.lead;
  b.lastBackup=num(d.lastBackup)>0?num(d.lastBackup):0;
  return b;
}

function stats(s){
  var map={};
  s.products.forEach(function(p){map[p.id]=Object.assign({},p,{bought:0,spent:0,sold:0});});
  s.purchases.forEach(function(x){var p=map[x.pid];if(p){p.bought+=x.qty;p.spent+=x.cost;}});
  s.sales.forEach(function(x){var p=map[x.pid];if(p){p.sold+=x.qty;}(x.packs||[]).forEach(function(u){var q=map[u.sid];if(q)q.sold+=u.qty;});});
  var list=Object.keys(map).map(function(k){var p=map[k];p.stock=p.bought-p.sold;p.avg=p.bought?p.spent/p.bought:0;return p;});
  var tot={cost:0,reinvest:0,reserve:0,me:0},profit=0,units=0,pocket=0;
  s.sales.forEach(function(x){
    tot.cost+=x.alloc.cost;tot.reinvest+=x.alloc.reinvest;tot.reserve+=x.alloc.reserve;tot.me+=x.alloc.me;
    profit+=x.profit;units+=x.qty;
  });
  var fund=tot.cost+tot.reinvest,reserve=tot.reserve,me=tot.me;
  s.purchases.forEach(function(x){if(x.from==='pocket')pocket+=x.cost;else fund-=x.cost;});
  s.moves.forEach(function(m){if(m.bucket==='reserve')reserve-=m.amount;else me-=m.amount;});
  return {map:map,list:list,tot:tot,profit:r2(profit),units:units,pocket:r2(pocket),
    revenue:r2(tot.cost+tot.reinvest+tot.reserve+tot.me),fund:r2(fund),reserve:r2(reserve),me:r2(me)};
}

function allocate(qty,price,unitCost,set,extra){
  var revenue=r2(qty*price),cost=r2(qty*unitCost+(extra||0)),profit=r2(revenue-cost);
  if(profit<=0)return {revenue:revenue,cost:cost,profit:profit,alloc:{cost:revenue,reinvest:0,reserve:0,me:0}};
  var reinvest=r2(profit*set.reinvest/100),reserve=r2(profit*set.reserve/100);
  var me=r2(profit-reinvest-reserve);
  return {revenue:revenue,cost:cost,profit:profit,alloc:{cost:cost,reinvest:reinvest,reserve:reserve,me:me}};
}

function validate(s){
  var st=stats(s);
  for(var i=0;i<st.list.length;i++){if(!st.list[i].supply&&st.list[i].stock<0)return 'No alcanza el stock de «'+st.list[i].name+'».';}
  var B=[['fund','Para comprar más'],['reserve','Reserva'],['me','Mi pago']];
  for(var j=0;j<B.length;j++){if(st[B[j][0]]<-0.005)return 'Eso dejaría «'+B[j][1]+'» en negativo: ese dinero ya se usó.';}
  return null;
}

function packUse(ids,qty,map){
  var uses=[],cost=0;
  (ids||[]).forEach(function(id){var p=map[id];if(p&&p.supply){uses.push({sid:id,qty:qty});cost+=qty*p.avg;}});
  return {uses:uses,cost:r2(cost)};
}
function backupInfo(s,now){
  var last=s.lastBackup||0,n=0;
  ['sales','purchases','moves'].forEach(function(k){s[k].forEach(function(x){if(x.ts>last)n++;});});
  var total=s.sales.length+s.purchases.length+s.moves.length;
  var days=last?Math.floor((now-last)/86400000):null;
  var need=n>0&&(last===0?total>=3:days>=7);
  return {last:last,unsaved:n,total:total,days:days,need:need};
}
function niceCeil(x){
  if(x<=0)return 0;
  if(x<100)return Math.ceil(x);
  if(x<10000)return Math.ceil(x/100)*100;
  if(x<100000)return Math.ceil(x/500)*500;
  return Math.ceil(x/1000)*1000;
}
/*LOGIC-END*/

var S;
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw)return migrate(JSON.parse(raw));
  }catch(e){storageOK=false;}
  return clone(DEFAULT);
}
var warnedSave=false;
var CLOUD_KEY='reventa-cloud';
function tidyUrl(u){
  return String(u||'').trim().replace(/\/$/,'').replace(/\/rest\/v1$/,'');
}
var cloud={url:'https://cylisiaqbnzwbksjfnaw.supabase.co',anon:'sb_publishable_8l9nasoX_ai2i0Ak8Dr6iA_YqqTBBTG',pin:'mi-reventa',ok:true,busy:false,last:0,err:''};
try{var saved=JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}');if(saved.last)cloud.last=saved.last;}catch(e){}
cloud.pin='mi-reventa';cloud.url=tidyUrl(cloud.url);
function persistCloud(){
  try{localStorage.setItem(CLOUD_KEY,JSON.stringify({last:cloud.last}));}catch(e){}
}
function cloudMsg(err){
  var m=String(err&&err.message||err||'').replace(/\s+/g,' ').slice(0,160);
  if(m.indexOf('PIN_CORTO')>-1)return 'El PIN debe tener al menos 4 caracteres.';
  if(m.indexOf('Could not find the table')>-1||m.indexOf('PGRST205')>-1||m.indexOf('reventa_box')>-1)return 'Falta correr activar.sql en Supabase y darle Run.';
  if(m.indexOf('Failed to fetch')>-1||m.indexOf('NetworkError')>-1)return 'Sin internet. Se guardó en este teléfono.';
  if(m.indexOf('Invalid JWT')>-1||m.indexOf('JWSError')>-1)return 'Esa clave no sirve así. Usa la publishable (sb_publishable_…).';
  if(m.indexOf('PGRST202')>-1||m.indexOf('schema cache')>-1||m.indexOf('reventa_pull')>-1)return 'Falta pegar el SQL en Supabase y darle Run.';
  if(!m)return 'No se pudo hablar con la nube.';
  return 'No se pudo: '+m;
}
function cloudHeaders(extra){
  var h={'Content-Type':'application/json',apikey:cloud.anon,Accept:'application/json'};
  if(cloud.anon.indexOf('eyJ')===0)h.Authorization='Bearer '+cloud.anon;
  if(extra)Object.keys(extra).forEach(function(k){h[k]=extra[k];});
  return h;
}
function cloudReq(path,opt){
  var url=tidyUrl(cloud.url);
  if(!url||!cloud.anon)return Promise.reject(new Error('Falta la URL de Supabase.'));
  return fetch(url+'/rest/v1/'+path,opt).then(function(res){
    return res.text().then(function(t){
      var j=null;try{j=JSON.parse(t);}catch(e){}
      if(!res.ok)throw new Error((j&&(j.message||j.details||j.hint))||t||('HTTP '+res.status));
      return j;
    });
  });
}
function boxPull(){
  return cloudReq('reventa_box?pin=eq.'+encodeURIComponent(cloud.pin)+'&select=data',{
    method:'GET',headers:cloudHeaders()
  }).then(function(rows){return rows&&rows[0]?rows[0].data:null;});
}
function boxPush(){
  return cloudReq('reventa_box?on_conflict=pin',{
    method:'POST',
    headers:cloudHeaders({Prefer:'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify({pin:cloud.pin,data:S,updated_at:new Date().toISOString()})
  });
}
function countMoves(s){return (s.sales||[]).length+(s.purchases||[]).length+(s.moves||[]).length;}
function applyCloudData(d){
  if(!d||typeof d!=='object')return false;
  if(!Array.isArray(d.sales)||!Array.isArray(d.purchases)||!Array.isArray(d.products))return false;
  var next=migrate(d),er=validate(next);
  if(er)return false;
  if(countMoves(next)<1&&countMoves(S)>0)return false;
  if(countMoves(next)<countMoves(S))return false;
  S=next;save({cloud:false});render();
  return true;
}
function cloudPush(){
  if(cloud.busy)return Promise.resolve();
  cloud.busy=true;
  return boxPush().then(function(){
    cloud.last=Date.now();cloud.err='';persistCloud();refreshCloudStatus();
  }).catch(function(e){
    cloud.err=cloudMsg(e);refreshCloudStatus();
  }).then(function(){cloud.busy=false;});
}
var cloudT;
function queueCloud(){
  clearTimeout(cloudT);
  cloudT=setTimeout(function(){cloudPush();},700);
}
function save(opts){
  try{localStorage.setItem(KEY,JSON.stringify(S));askPersist();if(!opts||opts.cloud!==false)queueCloud();}
  catch(e){storageOK=false;if(!warnedSave){warnedSave=true;toast('Este navegador no deja guardar datos. Copia un respaldo desde Ajustes.',true);}}
}
function cloudStatusHTML(){
  if(cloud.err)return '<p class="hint cloud-bad" id="cloudStatus">'+esc(cloud.err)+'</p>';
  return '<p class="hint cloud-ok" id="cloudStatus">Nube activa. Cada compra o venta se guarda sola.'+(cloud.last?' Último envío: '+ago(cloud.last)+'.':'')+'</p>';
}
function refreshCloudStatus(){
  var el=$('#cloudStatus');if(!el)return;
  el.outerHTML=cloudStatusHTML();
}
function readCloudForm(){
  var u=$('#cloudUrl'),a=$('#cloudAnon'),p=$('#cloudPin');
  if(u)cloud.url=tidyUrl(u.value);
  if(a)cloud.anon=a.value.trim();
  if(p)cloud.pin=p.value;
}
function markCloudOn(){
  cloud.ok=true;cloud.err='';cloud.last=Date.now();persistCloud();render();
}
function connectCloud(){
  readCloudForm();
  if(!cloud.pin){toast('Escribe un PIN de 4 números o más',true);return;}
  if(cloud.pin.length<4){toast('El PIN debe tener al menos 4 caracteres',true);return;}
  persistCloud();
  toast('Conectando…');
  boxPull().then(function(data){
    if(data&&applyCloudData(data)){markCloudOn();toast('Nube activa. Datos bajados.');return;}
    return boxPush().then(function(){markCloudOn();toast('Nube activa. Ya se guardan tus compras y ventas.');});
  }).catch(function(e){
    cloud.ok=false;cloud.err=cloudMsg(e);persistCloud();
    toast(cloud.err,true);refreshCloudStatus();
  });
}
S=load();
var persisted=null,askedPersist=false,pendingStamp=0;
function askPersist(){
  if(askedPersist)return;
  try{
    if(!(navigator.storage&&navigator.storage.persist&&navigator.storage.persisted))return;
    if(S.sales.length+S.purchases.length+S.moves.length<1)return;
    askedPersist=true;
    navigator.storage.persisted().then(function(p){
      if(p){persisted=true;return;}
      return navigator.storage.persist().then(function(ok){persisted=!!ok;});
    }).then(refreshBkStatus).catch(function(){});
  }catch(e){}
}

var LOC='es-CO';
var nf,cf;
try{nf=new Intl.NumberFormat(LOC,{maximumFractionDigits:0});}catch(e){nf=new Intl.NumberFormat('es',{maximumFractionDigits:0});}
try{cf=new Intl.NumberFormat(LOC,{style:'currency',currency:'COP',minimumFractionDigits:0,maximumFractionDigits:0});}catch(e){cf=null;}
function money(n){
  n=Math.round(r2(n));
  if(cf)return cf.format(n);
  return (n<0?'−':'')+'$ '+nf.format(Math.abs(n));
}
function fdate(ts){try{return new Date(ts).toLocaleDateString(LOC,{day:'numeric',month:'short'});}catch(e){return '';}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pct(a,b){return b>0?Math.round(a/b*100):0;}
function $(s){return document.querySelector(s);}
function greet(){
  var h=new Date().getHours();
  return h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';
}
function themeNow(){
  var t=document.documentElement.getAttribute('data-theme');
  if(t==='light'||t==='dark')return t;
  try{return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}catch(e){return 'light';}
}
function paintTheme(){
  var dark=themeNow()==='dark';
  var b=$('#btnTheme');
  if(b){
    b.innerHTML=dark
      ?'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>'
      :'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4.5A7.5 7.5 0 1 0 19.5 15 6 6 0 0 1 15 4.5z"/></svg>';
    b.setAttribute('aria-label',dark?'Cambiar a modo claro':'Cambiar a modo oscuro');
  }
  var m=document.querySelector('meta[name=theme-color]');
  if(m)m.content=dark?'#0B111A':'#0F1B2D';
}
function toggleTheme(){
  var next=themeNow()==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('reventa-theme',next);}catch(e){}
  paintTheme();
}
var deferredInstall=null;
function showInstall(){

  if(b)b.hidden=!deferredInstall;

function backupBlob(copy){
  return new Blob([JSON.stringify(copy)],{type:'application/json'});
}
function stampBackup(){
  var stamp=Date.now(),copy=clone(S);copy.lastBackup=stamp;
  return {stamp:stamp,copy:copy};
}
function doDownload(){
  var x=stampBackup(),a=document.createElement('a');
  a.href=URL.createObjectURL(backupBlob(x.copy));
  a.download='mi-reventa-respaldo.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},500);
  S.lastBackup=x.stamp;save();refreshBkStatus();
  var t=$('#bk');if(t)t.value=JSON.stringify(x.copy);
  toast('Respaldo descargado. Guárdalo en un lugar seguro.');
}

/* ---------- toast + commit ---------- */
var toastT;
function toast(msg,bad){
  var t=$('#toast');t.textContent=msg;t.className='toast show'+(bad?' bad':'');
  clearTimeout(toastT);toastT=setTimeout(function(){t.className='toast';},3800);
}
function commit(fn){
  var next=clone(S);fn(next);
  var err=validate(next);
  if(err){toast(err,true);return false;}
  S=next;save();render();return true;
}

function ago(ts){var d=Math.floor((Date.now()-ts)/86400000);return d<=0?'hoy':d===1?'ayer':'hace '+d+' días';}
function nMov(n){return n+(n===1?' movimiento nuevo':' movimientos nuevos');}
function backupStatusHTML(){
  var b=backupInfo(S,Date.now()),t;
  if(!b.total)t='Aún no tienes datos que respaldar.';
  else if(!b.last)t='Todavía no has hecho ningún respaldo.';
  else t='Último respaldo: '+ago(b.last)+(b.unsaved?', con '+nMov(b.unsaved)+' sin respaldar.':'. Estás al día.');
  var p=persisted===true?'El navegador confirmó que no borrará tus datos por su cuenta.':persisted===false?'El navegador no confirmó protección contra borrado automático, así que el respaldo es más importante.':'';
  return t+(p?'<br>'+p:'');
}
function refreshBkStatus(){var el=$('#bkStatus');if(el)el.innerHTML=backupStatusHTML();}
function backupNudge(){
  var b=backupInfo(S,Date.now());if(!b.need)return '';
  return '<section class="card nudge"><h2>Haz un respaldo</h2><p class="hint" style="margin-bottom:12px">'+
  (b.last?'Han pasado '+b.days+' días desde tu último respaldo y tienes '+nMov(b.unsaved)+'.':'Ya tienes '+b.total+' movimientos y ningún respaldo.')+
  ' Tus datos solo viven en este teléfono.</p><button class="btn sm" data-act="backupnow">Copiar respaldo</button></section>';
}
function doBackup(){
  var t=$('#bk');if(!t)return;
  var stamp=Date.now(),copy=clone(S);copy.lastBackup=stamp;
  t.value=JSON.stringify(copy);
  var done=$('#bkDone');if(done)done.style.display='none';
  function ok(){S.lastBackup=stamp;save();refreshBkStatus();toast('Respaldo copiado. Pégalo en Notas o envíatelo por WhatsApp.');}
  function fail(){pendingStamp=stamp;if(done)done.style.display='';t.focus();t.select();toast('Copia el texto seleccionado a mano y toca «Ya lo copié».',true);}
  try{navigator.clipboard.writeText(t.value).then(ok,fail);}catch(err){fail();}
}

  var a=[];
  S.sales.forEach(function(x){a.push({ts:x.ts,t:'Venta',d:nameOf(x.pid)+' ×'+x.qty,amt:x.qty*x.price,sign:1});});
  S.purchases.forEach(function(x){a.push({ts:x.ts,t:'Compra',d:nameOf(x.pid)+' ×'+x.qty,amt:x.cost,sign:-1,tag:x.from==='pocket'?'de tu bolsillo':'del fondo'});});

  '<div class="two"><div class="field"><label for="bQty">Cantidad</label><input id="bQty" type="number" inputmode="numeric" min="1" step="1" placeholder="10"></div>'+
  '<div class="field"><label for="bCost">Costo total con envío (COP)</label><input id="bCost" type="text" inputmode="numeric" min="0" placeholder="Ej. 80.000"></div></div>'+
  '<div class="field" id="bPriceField"><label for="bPrice">Precio de venta por unidad (COP)</label><input id="bPrice" type="text" inputmode="numeric" min="0" placeholder="Ej. 15.000"></div>'+
  '<div class="field"><span class="lab">Pagué con</span><div class="seg">'+
  '<input type="radio" id="bf1" name="bFrom" value="pocket" checked><label for="bf1">Mi bolsillo</label>'+
  '<input type="radio" id="bf2" name="bFrom" value="fund"><label for="bf2">Fondo ('+money(st.fund)+')</label></div></div>'+
  '<div id="bPrev" class="prev"></div>'+
  '<button class="btn" data-act="dobuy" data-primary>Registrar compra</button></section>'+
  (inv?'<section class="card"><h2>Inventario</h2><ul class="list plain">'+inv+'</ul></section>':'')+
  (supl?'<section class="card"><h2>Empaques e insumos</h2><ul class="list plain">'+supl+'</ul></section>':'')+
  (purs?'<section class="card"><h2>Compras recientes</h2><ul class="list plain">'+purs+'</ul></section>':'');
}

function viewSet(){
  var s=S.settings;
  return '<h1>Ajustes</h1>'+
  '<section class="card"><h2>En tu teléfono</h2>'+
  '<p class="hint">Puedes usarla como app. En Android toca <b>Instalar</b> arriba. En iPhone: compartir y «Añadir a pantalla de inicio». Los datos se guardan solos en la nube.</p></section>'+
  '<section class="card"><h2>Nube</h2>'+
  cloudStatusHTML()+
  '<p class="hint" style="margin-top:10px">No hay que activar nada. En este teléfono o en otro, ves lo mismo.</p></section>'+
  '<section class="card"><h2>Reparto de la ganancia</h2>'+
  '<p class="hint" style="margin-bottom:12px">Solo cambia las ventas nuevas. El costo del producto siempre vuelve al fondo.</p>'+
  '<div class="chips"><button class="chip" data-act="preset" data-r="50" data-s="20">Equilibrado 50/20/30</button><button class="chip" data-act="preset" data-r="70" data-s="15">Crecer rápido 70/15/15</button><button class="chip" data-act="preset" data-r="30" data-s="20">Más para mí 30/20/50</button></div>'+
  '<div class="slider"><div class="head"><label for="rngR">Reinversión</label><span id="vR"></span></div><input id="rngR" type="range" min="0" max="100" step="5" data-set="reinvest"></div>'+
  '<div class="slider"><div class="head"><label for="rngS">Reserva</label><span id="vS"></span></div><input id="rngS" type="range" min="0" max="100" step="5" data-set="reserve"></div>'+
  '<div class="slider"><div class="head"><span>Mi pago (lo que sobra)</span><span id="vM"></span></div></div>'+
  '<div id="setBar"></div><p class="hint" id="setEx"></p></section>'+
  '<section class="card"><h2>Precios</h2>'+
  '<p class="hint" style="margin-bottom:12px">Todo se cuenta en pesos colombianos (COP). Escribe 80000 o 80.000, da igual.</p>'+
  '<div class="field"><label for="mk">Ganancia que buscas sobre el costo (%)</label><input id="mk" type="number" inputmode="numeric" min="0" step="5" value="'+s.markup+'" data-set="markup"></div></section>'+
  '<section class="card"><h2>Respaldo</h2><p class="hint" id="bkStatus" style="margin-bottom:12px"></p>'+
  '<textarea id="bk" placeholder="Aquí aparece tu respaldo. Para restaurar, pega uno o elige un archivo."></textarea>'+
  '<input id="bkFile" type="file" accept="application/json,.json" hidden>'+
  '<div class="row" style="margin-top:10px">'+
  '<button class="btn sm" data-act="copybk">Copiar</button>'+
  '<button class="btn ghost sm" data-act="dlbk">Descargar</button>'+
  '<button class="btn ghost sm" data-act="pickbk">Elegir archivo</button>'+
  '<button class="btn ghost sm" data-act="restore">Restaurar</button></div>'+
  '<button class="btn ghost sm" id="bkDone" data-act="markbk" style="display:none;margin-top:10px">Ya lo copié</button></section>'+
  '<section class="card"><h2>Borrar todo</h2><p class="hint" style="margin-bottom:10px">Elimina compras, ventas y retiros de este navegador.</p><button class="btn danger sm" data-act="wipe">Borrar mis datos</button></section>';
}

/* ---------- render ---------- */
function render(){
  var st=stats(S);
  var v={home:viewHome,sell:viewSell,buy:viewBuy,set:viewSet}[tab];
  var box=$('#main');
  box.classList.remove('fade');
  box.innerHTML=(storageOK?'':'<p class="notice">Este navegador no permite guardar datos. Lo que registres se pierde al cerrar la página.</p>')+v(st);
  void box.offsetWidth;box.classList.add('fade');
  showInstall();
  document.querySelectorAll('.nav button').forEach(function(b){
    var on=b.dataset.tab===tab;b.classList.toggle('on',on);
    if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  if(tab==='sell')updSale();
  if(tab==='buy')syncBuyType();
  if(tab==='set'){syncSet();refreshBkStatus();}
}

/* ---------- vistas previas en vivo ---------- */
function updSale(){
  var sel=$('#sPid');if(!sel)return;
  var st=stats(S),p=st.map[sel.value];if(!p)return;
  var qty=Math.max(0,Math.floor(num($('#sQty').value))),price=num($('#sPrice').value);
  var el=$('#sPrev');
  if(qty<1||price<=0){el.innerHTML='<p class="hint">Pon cantidad y precio para ver cómo se reparte esta venta.</p>';return;}
  var ids=[].slice.call(document.querySelectorAll('#sPacks input:checked')).map(function(i){return i.value;});
  var pk=packUse(ids,qty,st.map);
  var a=allocate(qty,price,p.avg,S.settings,pk.cost);
  var over=a.cost>0?Math.round(a.profit/a.cost*100):0;
  var h='<div class="gain"><span class="hint">Ganas</span><b class="'+(a.profit<0?'neg':'pos')+'">'+money(a.profit)+'</b></div>'+
  '<p class="hint">'+(a.profit<0?'':over+'% sobre el costo')+'</p>'+bar(a.alloc,'sm')+
  '<div class="prow"><span>Costo, vuelve al fondo</span><b>'+money(a.alloc.cost)+'</b></div>'+
  (pk.cost>0?'<div class="prow"><span>Incluye empaque</span><b>'+money(pk.cost)+'</b></div>':'')+
  '<div class="prow"><span>Reinversión</span><b>'+money(a.alloc.reinvest)+'</b></div>'+
  '<div class="prow"><span>Reserva</span><b>'+money(a.alloc.reserve)+'</b></div>'+
  '<div class="prow"><span>Mi pago</span><b>'+money(a.alloc.me)+'</b></div>';
  if(a.profit<0)h+='<p class="warn">Vendes por debajo del costo. Todo el dinero vuelve al fondo y pierdes '+money(Math.abs(a.profit))+'.</p>';
  else if(a.profit===0)h+='<p class="warn">Con ese precio no ganas nada.</p>';
  if(qty>p.stock)h+='<p class="warn">Solo te quedan '+p.stock+' de este producto.</p>';
  pk.uses.forEach(function(u){var q=st.map[u.sid];if(q.stock<u.qty)h+='<p class="warn">De «'+esc(q.name)+'» solo te quedan '+Math.max(0,q.stock)+'. Registra una compra para reponer.</p>';});
  el.innerHTML=h;
}
function syncBuyType(){
  if(!$('#bName'))return;
  var isSup=buyType==='supply',st=stats(S);
  $('#bPriceField').style.display=isSup?'none':'';
  $('#bNameLab').textContent=isSup?'Empaque o insumo':'Producto';
  $('#bName').placeholder=isSup?'Ej. Bolsitas transparentes':'Ej. Aretes de perlas';
  $('#names').innerHTML=st.list.filter(function(p){return !!p.supply===isSup;}).map(function(p){return '<option value="'+esc(p.name)+'">';}).join('');
  updBuy();
}
function updBuy(){
  var el=$('#bPrev');if(!el)return;
  var st0=stats(S),isSup=buyType==='supply';
  var qty=Math.floor(num($('#bQty').value)),cost=num($('#bCost').value),price=num($('#bPrice').value);
  if(qty<1||cost<=0){el.innerHTML='<p class="hint">'+(isSup?'Pon cantidad y costo total para ver cuánto te cuesta cada unidad.':'Pon cantidad y costo total para ver cuánto te cuesta cada unidad y a cuánto venderla.')+'</p>';return;}
  var from0=document.querySelector('input[name=bFrom]:checked');
  var fw=(from0&&from0.value==='fund'&&cost>st0.fund)?'<p class="warn">El fondo tiene '+money(st0.fund)+'. Elige «Mi bolsillo» o baja el costo.</p>':'';
  if(isSup){el.innerHTML='<div class="prow"><span>Cada unidad te cuesta</span><b>'+money(cost/qty)+'</b></div><p class="hint">Se descontará cuando marques que lo usaste en una venta.</p>'+fw;return;}
  var nm=$('#bName').value.trim().toLowerCase(),mp=st0.list.find(function(p){return !p.supply&&p.name.toLowerCase()===nm;});
  var pk=0;if(mp)(mp.packs||[]).forEach(function(id){var q=st0.map[id];if(q&&q.supply)pk+=q.avg;});
  var unit=cost/qty+pk,sug=niceCeil(unit*(1+S.settings.markup/100));
  var h='<div class="prow"><span>Cada unidad te cuesta</span><b>'+money(cost/qty)+'</b></div>'+
  (pk>0?'<div class="prow"><span>Empaque por unidad</span><b>'+money(pk)+'</b></div>':'')+
  '<div class="prow"><span>Precio sugerido (+'+S.settings.markup+'%)</span><b>'+money(sug)+'<button type="button" class="link" data-act="usesug" data-v="'+sug+'">Usar</button></b></div>';
  if(price>0){
    var g=price-unit;
    h+='<div class="prow"><span>Ganas por unidad</span><b class="'+(g<=0?'neg':'pos')+'">'+money(g)+' ('+Math.round(g/unit*100)+'%)</b></div>'+
    '<div class="prow"><span>Si vendes todo</span><b class="'+(g<=0?'neg':'pos')+'">'+money(g*qty)+'</b></div>';
    if(g<=0)h+='<p class="warn">Ese precio no cubre el costo.</p>';
  }
  el.innerHTML=h+fw;
}
function syncSet(){
  var s=S.settings,me=100-s.reinvest-s.reserve;
  var r=$('#rngR'),q=$('#rngS');if(!r)return;
  r.value=s.reinvest;q.value=s.reserve;
  $('#vR').textContent=s.reinvest+'%';$('#vS').textContent=s.reserve+'%';$('#vM').textContent=me+'%';
  $('#setBar').innerHTML=bar({cost:0,reinvest:s.reinvest,reserve:s.reserve,me:me},'sm');
  $('#setEx').textContent='De cada '+money(100)+' de ganancia: '+money(s.reinvest)+' vuelven al negocio, '+money(s.reserve)+' van a la reserva y '+money(me)+' son tuyos.';
}

/* ---------- confirmación en dos toques ---------- */
var armedKey=null,armedBtn=null,armedTimer=null;
function disarm(){
  clearTimeout(armedTimer);
  if(armedBtn&&armedBtn.isConnected){armedBtn.textContent=armedBtn.dataset.old;armedBtn.classList.remove('armed');}
  armedKey=null;armedBtn=null;
}
function armed(b,key){
  if(armedKey===key){clearTimeout(armedTimer);armedKey=null;armedBtn=null;return true;}
  disarm();
  armedKey=key;armedBtn=b;b.dataset.old=b.textContent;b.textContent='Toca otra vez';b.classList.add('armed');
  armedTimer=setTimeout(disarm,3000);
  return false;
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,id=b.dataset.id;
  switch(act){
    case 'go':tab=b.dataset.tab;openMove=null;disarm();render();window.scrollTo(0,0);break;
    case 'move':openMove=(openMove===b.dataset.bucket)?null:b.dataset.bucket;render();break;
    case 'movecancel':openMove=null;render();break;
    case 'domove':{
      var amt=r2(num($('#mvAmt').value));
      if(amt<=0){toast('Pon un monto mayor a 0',true);break;}
      var note=($('#mvNote').value||'').trim().slice(0,60),bucket=b.dataset.bucket,prev=openMove;
      openMove=null;
      if(commit(function(n){n.moves.push({id:uid(),ts:Date.now(),bucket:bucket,amount:amt,note:note});}))toast('Registrado: '+money(amt));
      else openMove=prev;
      break;}
    case 'step':{
      var inp=$('#sQty');inp.value=Math.max(1,Math.floor(num(inp.value))+Number(b.dataset.d));updSale();break;}
    case 'dosale':{
      var pid=$('#sPid').value,qty=Math.floor(num($('#sQty').value)),price=num($('#sPrice').value);
      if(qty<1){toast('La cantidad debe ser al menos 1',true);break;}
      if(price<=0){toast('Pon el precio de venta',true);break;}
      var st1=stats(S),p=st1.map[pid];
      var ids=[].slice.call(document.querySelectorAll('#sPacks input:checked')).map(function(i){return i.value;});
      var pk=packUse(ids,qty,st1.map),a=allocate(qty,price,p.avg,S.settings,pk.cost);
      lastPid=pid;
      if(commit(function(n){
        n.sales.push({id:uid(),ts:Date.now(),pid:pid,qty:qty,price:price,unitCost:p.avg,packs:pk.uses,packCost:pk.cost,profit:a.profit,alloc:a.alloc});
        var np=n.products.find(function(x){return x.id===pid;});if(np)np.packs=ids;
      }))
        toast(a.profit>=0?'Venta registrada. Ganaste '+money(a.profit):'Venta registrada con pérdida de '+money(Math.abs(a.profit)));
      break;}
    case 'delsale':
      if(armed(b,'s'+id))commit(function(n){n.sales=n.sales.filter(function(x){return x.id!==id;});});break;
    case 'usesug':$('#bPrice').value=b.dataset.v;updBuy();break;
    case 'dobuy':{
      var isSup=buyType==='supply';
      var name=$('#bName').value.trim().slice(0,50),bq=Math.floor(num($('#bQty').value)),cost=r2(num($('#bCost').value)),bp=num($('#bPrice').value);
      var from=document.querySelector('input[name=bFrom]:checked').value;
      if(!name){toast('Escribe el nombre del producto',true);break;}
      if(bq<1){toast('La cantidad debe ser al menos 1',true);break;}
      if(cost<=0){toast('Pon el costo total de la compra',true);break;}
      if(!isSup&&bp<=0){toast('Pon el precio al que lo vas a vender',true);break;}
      var clash=S.products.find(function(x){return x.name.toLowerCase()===name.toLowerCase()&&!!x.supply!==isSup;});
      if(clash){toast('Ya tienes «'+clash.name+'» registrado como '+(isSup?'producto para vender':'empaque o insumo')+'. Usa otro nombre.',true);break;}
      if(commit(function(n){
        var pr=n.products.find(function(x){return x.name.toLowerCase()===name.toLowerCase();});
        if(!pr){pr={id:uid(),name:name,price:isSup?0:bp};if(isSup)pr.supply=true;n.products.push(pr);}
        if(!isSup)pr.price=bp;
        n.purchases.push({id:uid(),ts:Date.now(),pid:pr.id,qty:bq,cost:cost,from:from});
      }))toast(isSup?'Registrado. Ya puedes descontar «'+name+'» en tus ventas':'Compra registrada. Ya puedes vender «'+name+'»');
      break;}
    case 'delpur':
      if(armed(b,'p'+id))commit(function(n){
        n.purchases=n.purchases.filter(function(x){return x.id!==id;});
        n.products=n.products.filter(function(pr){
          return n.purchases.some(function(x){return x.pid===pr.id;})||n.sales.some(function(x){return x.pid===pr.id||(x.packs||[]).some(function(u){return u.sid===pr.id;});});
        });
      });break;
    case 'delmove':
      if(armed(b,'m'+id))commit(function(n){n.moves=n.moves.filter(function(x){return x.id!==id;});});break;
    case 'preset':
      S.settings.reinvest=Number(b.dataset.r);S.settings.reserve=Number(b.dataset.s);save();syncSet();toast('Reparto actualizado');break;
    case 'copybk':doBackup();break;
    case 'dlbk':doDownload();break;
    case 'pickbk':{
      var f=$('#bkFile');if(f)f.click();
      break;}
    case 'backupnow':tab='set';openMove=null;render();window.scrollTo(0,0);doBackup();break;
    case 'markbk':
      if(pendingStamp){S.lastBackup=pendingStamp;pendingStamp=0;save();$('#bkDone').style.display='none';refreshBkStatus();toast('Anotado');}break;
    case 'restore':{
      var raw=$('#bk').value.trim();
      if(!raw){toast('Pega primero un respaldo en el cuadro',true);break;}
      try{
        var d=JSON.parse(raw);
        if(!d||!Array.isArray(d.sales)||!Array.isArray(d.purchases)||!Array.isArray(d.products))throw new Error('x');
        var next=migrate(d),er=validate(next);
        if(er){toast(er,true);break;}
        S=next;save();tab='home';render();toast('Datos restaurados');
      }catch(err){toast('Ese texto no es un respaldo válido',true);}
      break;}
    case 'cloudon':connectCloud();break;
    case 'cloudoff':
      cloud.ok=false;cloud.err='';persistCloud();refreshCloudStatus();toast('Este teléfono ya no envía a la nube. Los datos de allá siguen.');
      render();break;
    case 'copysql':
      fetch('supabase.sql').then(function(r){if(!r.ok)throw new Error('x');return r.text();}).then(function(t){
        var done=function(){toast('SQL copiado. Pégalo en Supabase → SQL Editor → Run.');};
        try{navigator.clipboard.writeText(t).then(done,function(){throw new Error('x');});}catch(err){toast('Abre el archivo supabase.sql y cópialo a mano.',true);}
      }).catch(function(){toast('Abre el archivo supabase.sql y cópialo a mano.',true);});
      break;
    case 'wipe':
      if(armed(b,'wipe')){S=clone(DEFAULT);save({cloud:false});tab='home';render();toast('Datos borrados de este teléfono. La nube no se tocó.');}break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.set){
    var s=S.settings,k=t.dataset.set;
    if(k==='reinvest'){s.reinvest=Math.round(num(t.value));if(s.reserve>100-s.reinvest)s.reserve=100-s.reinvest;syncSet();}
    else if(k==='reserve'){s.reserve=Math.min(Math.round(num(t.value)),100-s.reinvest);syncSet();}
    else if(k==='markup'){s.markup=Math.max(0,num(t.value));}
    save();return;
  }
  if(t.id==='sQty'||t.id==='sPrice')updSale();
  else if(t.id==='bQty'||t.id==='bCost'||t.id==='bPrice')updBuy();
  else if(t.id==='bName'){
    var pr=S.products.find(function(x){return x.name.toLowerCase()===t.value.trim().toLowerCase();});
    if(pr&&!pr.supply&&!$('#bPrice').value)$('#bPrice').value=pr.price;
    updBuy();
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='sPid'){
    var p=S.products.find(function(x){return x.id===t.value;});
    if(p){$('#sPrice').value=p.price;lastPid=p.id;
      document.querySelectorAll('#sPacks input').forEach(function(i){i.checked=(p.packs||[]).indexOf(i.value)>-1;});}
    updSale();
  }
  else if(t.closest&&t.closest('#sPacks'))updSale();
  else if(t.name==='bType'){buyType=t.value;syncBuyType();}
  else if(t.name==='bFrom')updBuy();
  else if(t.id==='bkFile'&&t.files&&t.files[0]){
    var file=t.files[0],reader=new FileReader();
    reader.onload=function(){
      var area=$('#bk');if(area)area.value=String(reader.result||'');
      toast('Archivo cargado. Toca Restaurar para aplicarlo.');
    };
    reader.onerror=function(){toast('No se pudo leer ese archivo',true);};
    reader.readAsText(file);t.value='';
  }
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.target.tagName!=='INPUT'||e.target.type==='radio')return;
  var f=e.target.closest('[data-form]'),b=f&&f.querySelector('[data-primary]');
  if(b){e.preventDefault();b.click();}
});

paintTheme();
showInstall();
document.getElementById('btnTheme').addEventListener('click',toggleTheme);
document.getElementById('btnInstall').addEventListener('click',function(){
  if(!deferredInstall)return;
  deferredInstall.prompt();
  deferredInstall.userChoice.finally(function(){deferredInstall=null;showInstall();});
});
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  deferredInstall=e;
  showInstall();
});
window.addEventListener('appinstalled',function(){deferredInstall=null;showInstall();});
render();
askPersist();
boxPull().then(function(data){
  if(data&&applyCloudData(data))toast('Datos actualizados desde la nube');
  else queueCloud();
}).catch(function(e){
  cloud.err=cloudMsg(e);refreshCloudStatus();
});
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
